<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reset password</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 960px; height: 760px; box-sizing: border-box; display: flex; background: #F4F5FA; font-family: 'Public Sans', system-ui, sans-serif; color: #151A3C">
  <div style="width: 340px; flex-shrink: 0; box-sizing: border-box; background: #141B4D; padding: 36px 32px; display: flex; flex-direction: column; gap: 40px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 28px; height: 28px; border-radius: 8px; background: #F0B54A"></div>
      <div style="font-weight: 700; font-size: 16px; color: #FFFFFF">Society Konnect</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 30px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; color: #FFFFFF">Locked out? It happens.</div>
      <div style="font-size: 14px; line-height: 1.5; color: #C3C9F0">Enter your email and we'll send you a link to set a new password.</div>
    </div>
  </div>
  <div style="flex: 1; box-sizing: border-box; padding: 40px 44px; display: flex; flex-direction: column; gap: 20px; min-width: 0">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em; color: #141B4D">Reset your password</h1>
      <div style="font-size: 14px; color: #4A5080">We'll email you a reset link.</div>
    </div>
    <sc-if value="{{notSent}}" hint-placeholder-val="{{ true }}">
      <div style="background: #FFFFFF; border: 1px solid #DDE0F0; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <label for="femail" style="font-size: 13px; font-weight: 600; color: #333A6B">Email</label>
          <input id="femail" type="email" placeholder="you@company.com" value="{{email}}" onChange="{{onEmail}}" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #CBD0E8; border-radius: 10px; font-size: 15px; color: #151A3C; background: #FFFFFF">
        </div>
        <button type="button" onClick="{{send}}" style="height: 52px; border: 0; border-radius: 12px; font-family: inherit; font-size: 16px; font-weight: 700; background: #F0B54A; color: #141B4D">Send reset link</button>
      </div>
    </sc-if>
    <sc-if value="{{sent}}" hint-placeholder-val="{{ false }}">
      <div style="background: #FFFFFF; border: 1px solid #DDE0F0; border-radius: 16px; padding: 32px 28px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px">
        <div style="width: 52px; height: 52px; border-radius: 50%; background: #0A6B3F; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 14 14" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5l2.5 2.5L11 4.5"/></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="font-size: 20px; font-weight: 700; color: #0A6B3F">Check your email</div>
          <div style="font-size: 15px; line-height: 1.5; color: #333A6B">If there is an account for {{shownEmail}}, we have sent a link to set a new password.</div>
        </div>
      </div>
    </sc-if>
    <div style="display: flex; margin-top: auto">
      <a href="Login.dc.html" style="font-size: 14px; font-weight: 600; color: #333A6B; padding: 12px 4px">Back to log in</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":760}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sent: false, email: '' };
}
renderVals() {
const { sent, email } = this.state;
return {
sent: sent,
notSent: !sent,
email: email,
shownEmail: email.trim() === '' ? 'that email' : email.trim(),
onEmail: (e) => this.setState({ email: e.target.value }),
send: () => this.setState({ sent: true })
};
}
}
</script>
</body>
</html>
